<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Beneficios | StorytellerS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --morado: #341539;
    --dorado: #D8C3A5;
    --dorado-oscuro: #8a6f45;
    --crema: #F5F3ED;
    --texto: #2a1a2d;
    --ancho: 1120px;
    --lado: clamp(22px, 5vw, 56px);
    --margen: max(var(--lado), calc((100% - var(--ancho)) / 2));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--crema);
    color: var(--texto);
    font-family: "Cormorant Garamond", Georgia, serif;
    font-size: 20px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--dorado-oscuro); outline-offset: 3px; }

  .hero {
    background: var(--morado);
    color: var(--crema);
    padding: clamp(26px, 5vh, 44px) var(--margen) clamp(28px, 5.5vh, 48px);
  }
  .hero.con-extra { padding-top: clamp(16px, 3vh, 26px); }
  .hero-top { display: flex; justify-content: center; margin-bottom: clamp(16px, 3vh, 26px); }
  .hero-top a { display: inline-block; line-height: 0; }
  .hero-top img { height: clamp(120px, 17vw, 190px); width: auto; max-width: 100%; display: block; }
  .hero.con-extra { text-align: center; }
  .hero.con-extra .hero-inner { margin: 0 auto; }
  .hero-inner { max-width: 900px; }
  .hero .logo { display: inline-block; line-height: 0; margin-top: clamp(16px, 2.6vh, 24px); }
  .hero .logo img { height: clamp(18px, 2.4vw, 24px); width: auto; display: block; transition: opacity .2s; }
  .hero .logo:hover img { opacity: .75; }
  .hero h1:empty { display: none; }
  .hero p {
    font-style: italic;
    font-size: clamp(1.2rem, 3vw, 1.7rem);
    color: var(--dorado);
    margin-top: .5em;
  }
  .hero h1 {
    font-weight: 500;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    line-height: 1;
    letter-spacing: -.01em;
  }

  main { padding: 0 var(--margen); }

  .beneficio {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 56px 0;
    border-bottom: 1px solid var(--dorado);
  }
  .beneficio h2 {
    font-weight: 600;
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    line-height: 1.1;
    color: var(--morado);
    margin-bottom: 14px;
  }
  .beneficio p { max-width: 52ch; }

  .media {
    width: 100%;
    aspect-ratio: 4 / 3;
    overflow: hidden;
    background: var(--morado);
    position: relative;
  }
  a.media { display: block; cursor: pointer; text-decoration: none; }
  a.media::after {
    content: "Ver PDF";
    position: absolute; right: 14px; bottom: 14px;
    background: var(--dorado); color: var(--morado);
    font-weight: 600; font-size: 1rem; letter-spacing: .04em;
    padding: 6px 16px;
  }
  a.media:hover .panel, a.media:hover img { opacity: .88; }
  .enlace-pdf {
    display: inline-block;
    margin-top: 22px;
    border: 1px solid var(--morado);
    color: var(--morado);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.1rem;
    padding: 11px 24px;
    transition: background .2s, color .2s;
  }
  .enlace-pdf:hover { background: var(--morado); color: var(--dorado); }
  .media img, .media video {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .media iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .media .panel {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--dorado);
    font-weight: 500;
    font-size: clamp(3rem, 12vw, 5.5rem);
    letter-spacing: .02em;
    text-align: center;
    padding: 20px;
    border: 1px solid var(--dorado);
    outline: 8px solid var(--morado);
    outline-offset: -9px;
  }
  .media .panel.chico { font-size: clamp(1.6rem, 5vw, 2.2rem); font-style: italic; }

  @media (min-width: 760px) {
    .beneficio { grid-template-columns: 1fr 1fr; gap: clamp(40px, 6vw, 88px); align-items: center; padding: 72px 0; }
    .beneficio h2 { font-size: clamp(2.2rem, 3.6vw, 3rem); }
    .beneficio p { font-size: 1.3rem; }
    .beneficio:nth-of-type(even) .media { order: -1; }
  }

  .contacto { padding: 64px 0 28px; }
  .contacto p { font-style: italic; font-size: 1.3rem; margin-bottom: 20px; }
  .boton {
    display: inline-block;
    background: var(--morado);
    color: var(--dorado);
    text-decoration: none;
    font-weight: 600;
    font-size: 1.2rem;
    padding: 14px 30px;
    transition: background .2s, color .2s;
  }
  .boton:hover { background: var(--dorado); color: var(--morado); }

  .condiciones {
    font-size: .95rem;
    color: #5b4a5e;
    padding: 28px 0 56px;
    max-width: 70ch;
  }

  footer {
    background: var(--morado);
    color: var(--dorado);
    text-align: center;
    padding: 30px var(--margen);
    font-size: .95rem;
    letter-spacing: .06em;
  }

  .error { padding: 18vh 6vw; text-align: center; }
  .error h1 { color: var(--morado); font-weight: 500; font-size: 2.4rem; margin-bottom: .4em; }
</style>
</head>
<body>
<div id="app"></div>
<footer>StorytellerS Cinematography · Puebla, México</footer>

<script>
(async function () {
  const app = document.getElementById("app");

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function noEncontrada() {
    app.replaceChildren();
    const box = el("div", "error");
    box.append(el("h1", "", "Esta página no está disponible"));
    box.append(el("p", "", "Revisa que el enlace esté completo o escríbenos para recibir uno nuevo."));
    app.append(box);
  }

  const slug = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop() || "")
    .toLowerCase();

  let data;
  try {
    const r = await fetch("/aliados.json", { cache: "no-cache" });
    data = await r.json();
  } catch (e) { return noEncontrada(); }

  const a = data[slug];
  if (!a) return noEncontrada();

  document.title = (a.nombre ? a.nombre + " | " : "") + "Beneficios StorytellerS";

  const hero = el("section", "hero");
  const inner = el("div", "hero-inner");
  if (a.nombre) inner.append(el("h1", "", a.nombre));
  inner.append(el("p", "", a.intro || "Te obsequia estos exclusivos beneficios"));
  const logo = el("a", "logo");
  logo.href = "/";
  logo.target = "_blank";
  logo.rel = "noopener";
  logo.setAttribute("aria-label", "Ir al sitio de StorytellerS Cinematography");
  const li = new Image();
  li.src = "/img/logo-storytellers.png";
  li.alt = "StorytellerS Cinematography";
  logo.append(li);
  inner.append(logo);
  if (a.logo) {
    hero.classList.add("con-extra");
    const top = el("div", "hero-top");
    const im = new Image();
    im.src = a.logo;
    im.alt = a.logoAlt || "";
    im.onerror = function () { hero.classList.remove("con-extra"); top.remove(); };
    if (a.logoLink) {
      const l = el("a");
      l.href = a.logoLink; l.target = "_blank"; l.rel = "noopener";
      l.append(im);
      top.append(l);
    } else {
      top.append(im);
    }
    hero.append(top);
  }
  hero.append(inner);

  const main = el("main");

  function panel(texto) {
    const p = el("div", "panel", texto || "StorytellerS");
    if (!texto) p.classList.add("chico");
    return p;
  }

  (a.beneficios || []).forEach(function (b) {
    const art = el("article", "beneficio");
    const textos = el("div");
    textos.append(el("h2", "", b.titulo));
    textos.append(el("p", "", b.texto));

    const conPdf = b.pdf && !b.vimeo && !b.video;
    const media = el(conPdf ? "a" : "div", "media");
    if (conPdf) {
      media.href = b.pdf;
      media.target = "_blank";
      media.rel = "noopener";
      media.setAttribute("aria-label", b.pdfTexto || "Abrir PDF");
    }
    if (b.vimeo) {
      const f = document.createElement("iframe");
      f.src = "https://player.vimeo.com/video/" + encodeURIComponent(b.vimeo) + "?title=0&byline=0&portrait=0";
      f.allow = "autoplay; fullscreen; picture-in-picture";
      f.allowFullscreen = true;
      f.loading = "lazy";
      f.title = b.titulo;
      media.append(f);
    } else if (b.video) {
      const v = document.createElement("video");
      v.src = b.video;
      v.muted = true; v.loop = true; v.autoplay = true; v.playsInline = true; v.controls = true;
      v.preload = "metadata";
      if (b.poster) v.poster = b.poster;
      v.onerror = function () { media.replaceChildren(panel(b.destacado)); };
      media.append(v);
    } else if (b.imagen) {
      const img = new Image();
      img.alt = b.titulo;
      img.loading = "lazy";
      img.onerror = function () { media.replaceChildren(panel(b.destacado)); };
      img.src = b.imagen;
      media.append(img);
    } else {
      media.append(panel(b.destacado));
    }

    if (b.pdf) {
      const l = el("a", "enlace-pdf", b.pdfTexto || "Ver servicios y paquetes (PDF)");
      l.href = b.pdf;
      l.target = "_blank";
      l.rel = "noopener";
      textos.append(l);
    }

    art.append(textos, media);
    main.append(art);
  });

  if (a.whatsapp) {
    const c = el("section", "contacto");
    c.append(el("p", "", "¿Lista para usar tus beneficios?"));
    const btn = el("a", "boton", "Escríbenos por WhatsApp");
    btn.href = "https://wa.me/" + encodeURIComponent(a.whatsapp) +
      "?text=" + encodeURIComponent(a.mensaje || "");
    btn.target = "_blank";
    btn.rel = "noopener";
    c.append(btn);
    main.append(c);
  }

  if (a.condiciones) main.append(el("p", "condiciones", a.condiciones));

  app.replaceChildren(hero, main);
})();
</script>
</body>
</html>
